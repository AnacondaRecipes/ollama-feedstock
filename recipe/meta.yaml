{% set version = "0.30.10" %}

package:
  name: ollama
  version: {{ version }}

source:
  url: https://github.com/ollama/ollama/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 9a172295f668cb91b6f9065f0767e805fe59da679145191798933b9d36b45b93
  patches:
    - 0001-cmake-forward-cross-compilation-vars.patch

build:
  # CUDA variants get build_number + 100 so the solver prefers the CPU build.
  # Inline jinja (not duplicate selector keys) keeps the recipe linter happy.
  number: {{ 100 if (cuda_compiler_version | default("None")) != "None" else 0 }}
  string: {{ ("cuda" + (cuda_compiler_version | replace('.', '')) if (cuda_compiler_version | default("None")) != "None" else "cpu") }}_h{{ PKG_HASH }}_{{ PKG_BUILDNUM }}
  # TODO(PKG-15685): Windows (m2w64 go-cgo + CUDA + ninja) and osx (host llama-ui-embed
  # links conda libc++ against AR's older SDK libc++ -> missing bad_function_call) need
  # follow-up work; conda-forge's win builds are also red. This PR ships linux only.
  skip: true  # [win or osx]
  ignore_run_exports_from:
    - libcublas-dev    # [cuda_compiler_version != "None"]

requirements:
  build:
    # AR's cgo_compiler_version (1.21) is too old for ollama's go.mod (go 1.26.0);
    # hardpin go-cgo to the latest on pkgs/main like wandb-feedstock.
    - go-cgo 1.26.4
    - cmake
    - make
    # llama.cpp is pulled via cmake FetchContent (git clone) at the pinned LLAMA_CPP_VERSION.
    - git
    - go-licenses >=1.6,<2
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }}                        # [cuda_compiler_version != "None"]
    - cuda-version =={{ cuda_compiler_version }}     # [cuda_compiler_version != "None"]
  host:
    - cuda-version =={{ cuda_compiler_version }}     # [cuda_compiler_version != "None"]
    - libcublas-dev                                  # [cuda_compiler_version != "None"]

test:
  commands:
    - HOME=/tmp ollama --version    # [unix]

about:
  home: https://ollama.com/
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Ollama CLI
  description: |
    Ollama is an easy way to get local language models running on your computer through a command-line interface.
  doc_url: https://github.com/ollama/ollama
  dev_url: https://github.com/ollama/ollama

extra:
  recipe-maintainers:
    - jmakovicka
    - sodre
    - benmoss
    - xkong-anaconda
