context:
  version: "0.30.10"
  llama_cpp_version: "b9672"
  cuda: ${{ "true" if cuda_compiler_version != "None" else "" }}
  cuda_build_string: cuda_${{ cuda_compiler_version | version_to_buildstring }}
  string_prefix: ${{ cuda_build_string if cuda else "cpu_" }}
  build_number: 0

package:
  name: ollama
  version: ${{ version }}

source:
  - url: https://github.com/ollama/ollama/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 9a172295f668cb91b6f9065f0767e805fe59da679145191798933b9d36b45b93
    patches:
      - 0001-cmake-forward-cross-compilation-vars.patch
  # Pinned llama.cpp source (must match the LLAMA_CPP_VERSION file in the ollama
  # tree); build.sh pre-applies ollama's compat patches to it, then hands it to
  # cmake via FETCHCONTENT_SOURCE_DIR_LLAMA_CPP so nothing is git-cloned at build time.
  - url: https://github.com/ggml-org/llama.cpp/archive/refs/tags/${{ llama_cpp_version }}.tar.gz
    sha256: a27ccaeb51c9a8b9d9e8160c64546bf067b14ddff47840175dbc7fa2e14c3c38
    target_directory: llama.cpp-src

build:
  number: ${{ build_number }}
  string: ${{ string_prefix }}h${{ hash }}_${{ build_number }}
  variant:
    use_keys:
      # use cuda from the variant config, e.g. to build multiple CUDA variants
      - ${{ "cuda" if cuda }}
    # this will down-prioritize the cuda variant versus other variants of the package
    down_prioritize_variant: ${{ 1 if cuda == "true" else 0 }}
  script:
    - if: win
      then: [build.bat]
      else: [build.sh]
  skip:
    - cuda and match(cuda_compiler_version, "<12")
    # TODO(PKG-15685): macOS and Windows skipped, tracked as follow-ups.
    #  - osx: the fetched llama.cpp tools/ui llama-ui-embed host tool is built with
    #    conda clang, whose newer libc++ (ne200100 ABI) needs std::bad_function_call
    #    symbols absent from AR's macOS SDK 12.1 system libc++; the link fails.
    #  - win: m2w64 go-cgo + ninja + from-source llama.cpp (conda-forge's win is red).
    - win
    - osx

requirements:
  build:
    # AR's cgo_compiler_version (1.21) is too old for ollama's go.mod (go 1.26.0);
    # hardpin go-cgo to the latest on pkgs/main like wandb-feedstock instead of
    # ${{ compiler('go-cgo') }}.
    - go-cgo 1.26.5
    - cmake
    - make
    # needed by ollama's llama.cpp compat patch step (`git apply`); the
    # llama.cpp source itself is a pinned source entry above.
    - git
    - go-licenses ~=1.6
    - if: win
      then:
        - ${{ stdlib('m2w64_c') }}
        - ${{ compiler('m2w64_cxx') }}
      else:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
    - if: cuda
      then:
        - ${{ compiler('cuda') }}
        - cuda-version ==${{ cuda_compiler_version }}
  host:
    - if: cuda
      then:
        - cuda-version ==${{ cuda_compiler_version }}
        - libcublas-dev
  ignore_run_exports:
    from_package:
      - if: cuda
        then: libcublas-dev
tests:
  - script:
      - if: unix
        then: HOME=/tmp ollama --version  # ollama panics if $HOME is unset (upstream regression in v0.20.7)
      - if: win
        then: ollama --version

about:
  homepage: https://ollama.com/
  repository: https://github.com/ollama/ollama
  documentation: https://github.com/ollama/ollama
  summary: Ollama CLI
  description: |
    Ollama is an easy way to get local language models running on your computer through a command-line interface.
  license: MIT
  license_file:
    - LICENSE
    - license-files/

extra:
  recipe-maintainers:
    - jmakovicka
    - sodre
    - benmoss
    - xkong-anaconda
